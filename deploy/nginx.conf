# /etc/nginx/sites-available/mr-connect  (replace mr.example.com with your domain)
server {
    listen 80;
    server_name mr.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name mr.example.com;
    ssl_certificate     /etc/letsencrypt/live/mr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mr.example.com/privkey.pem;
    client_max_body_size 10m;           # attachments are limited to 10 MB
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4000;   # API and the built admin panel share one origin
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
